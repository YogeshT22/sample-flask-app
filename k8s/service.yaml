# --------------------------------------
# Kubernetes Service for Flask App
# Purpose: Expose Flask application within the cluster
# Target: Local development using Kubernetes
# ---------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  # app label required for Prometheus ServiceMonitor discovery.
  # The relabeling rule checks __meta_kubernetes_service_label_app = flask-app
  # on the Service resource itself — not just the pod selector below.
  labels:
    app: flask-app
spec:
  # Dev note: makes the service only reachable from within the cluster.
  type: ClusterIP
  selector:
    app: flask-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
