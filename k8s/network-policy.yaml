# --------------------------------------
# NetworkPolicy for Flask App
# Purpose: Restrict network access to only what the app legitimately needs.
# Ingress: Allow traffic from Traefik ingress, Prometheus monitoring, and intra-namespace test runners.
# Egress:  Allow DNS (port 53).
# --------------------------------------

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flask-app-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: flask-app

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # 1. Allow traffic from the k3s ingress controller (Traefik in kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 5000

    # 2. Allow Prometheus in monitoring namespace to scrape /metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5000

    # 3. Allow intra-namespace traffic (e.g. k6 test runner pods, health checks)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 5000

  egress:
    # DNS: allow name resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
