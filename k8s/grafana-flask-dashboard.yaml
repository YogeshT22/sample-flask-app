# --------------------------------------
# Grafana Dashboard ConfigMap — Flask App Observability
# Namespace: monitoring (where Grafana's sidecar watches)
# Label: grafana_dashboard: "1" — auto-discovered by Grafana sidecar
#
# Panels:
#   Row 1 (stats):    Total Requests | Error Rate | p95 Latency | Active Requests
#   Row 2 (charts):   Request Rate by Status Code | Response Time Percentiles
#   Row 3 (charts):   Request Rate by Endpoint   | Ready Pods (kube-state-metrics)
# --------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-flask-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  flask-app-observability.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["flask", "python", "cicd"],
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Flask App \u2014 Observability",
      "uid": "flask-app-obs-v1",
      "version": 1,
      "templating": {
        "list": [{
          "current": {"selected": false, "text": "Prometheus", "value": "Prometheus"},
          "hide": 0,
          "includeAll": false,
          "label": "Data Source",
          "name": "datasource",
          "options": [],
          "query": "prometheus",
          "refresh": 1,
          "type": "datasource"
        }]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total Requests",
          "description": "Cumulative HTTP requests since the app started",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]},
              "unit": "short",
              "mappings": []
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "${datasource}"}, "expr": "sum(flask_http_request_total)", "legendFormat": "Requests", "refId": "A"}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error Rate",
          "description": "Percentage of 5xx responses over the last 5 minutes",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]
              },
              "unit": "percent",
              "min": 0,
              "max": 100,
              "mappings": []
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "100 * sum(rate(flask_http_request_total{status=~\"5..\"}[5m])) / (sum(rate(flask_http_request_total[5m])) > 0) or vector(0)",
            "legendFormat": "Error %",
            "refId": "A"
          }]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 Latency",
          "description": "95th percentile response time over the last 5 minutes",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "red", "value": 1}]
              },
              "unit": "s",
              "mappings": []
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le))",
            "legendFormat": "p95",
            "refId": "A"
          }]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Active Requests",
          "description": "Currently in-flight HTTP requests",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 10}, {"color": "red", "value": 50}]
              },
              "unit": "short",
              "mappings": []
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "sum(flask_http_request_active) or vector(0)",
            "legendFormat": "In-flight",
            "refId": "A"
          }]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request Rate by Status Code",
          "description": "HTTP requests per second broken down by response status code",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": false},
              "unit": "reqps"
            },
            "overrides": [
              {"matcher": {"id": "byRegexp", "options": "^2..$"}, "properties": [{"id": "color", "value": {"fixedColor": "#73BF69", "mode": "fixed"}}]},
              {"matcher": {"id": "byRegexp", "options": "^4..$"}, "properties": [{"id": "color", "value": {"fixedColor": "#F5A623", "mode": "fixed"}}]},
              {"matcher": {"id": "byRegexp", "options": "^5..$"}, "properties": [{"id": "color", "value": {"fixedColor": "#F2495C", "mode": "fixed"}}]}
            ]
          },
          "options": {
            "legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "sum by (status) (rate(flask_http_request_total[1m]))",
            "legendFormat": "HTTP {{status}}",
            "refId": "A"
          }]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Response Time Percentiles",
          "description": "p50 / p95 / p99 response latency over time",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2, "fillOpacity": 5, "spanNulls": false},
              "unit": "s"
            }
          },
          "options": {
            "legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "expr": "histogram_quantile(0.50, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50", "refId": "A"},
            {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95", "refId": "B"},
            {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "expr": "histogram_quantile(0.99, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99", "refId": "C"}
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Request Rate by Endpoint",
          "description": "Requests per second per HTTP method and path",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2, "fillOpacity": 10},
              "unit": "reqps"
            }
          },
          "options": {
            "legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "sum by (method, path) (rate(flask_http_request_total[1m]))",
            "legendFormat": "{{method}} {{path}}",
            "refId": "A"
          }]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Ready Pods",
          "description": "Number of flask-app-deployment replicas currently ready (from kube-state-metrics)",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "fieldConfig": {
            "defaults": {
              "color": {"fixedColor": "#5794F2", "mode": "fixed"},
              "custom": {"lineWidth": 2, "fillOpacity": 20},
              "unit": "short",
              "min": 0
            }
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "single"}
          },
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "kube_deployment_status_replicas_ready{deployment=\"flask-app-deployment\"}",
            "legendFormat": "Ready Pods",
            "refId": "A"
          }]
        }
      ]
    }
